<circle cx="510" cy="100" r="3" fill="#14b8a6" opacity="0.03"/>
<circle cx="695" cy="65" r="1" fill="#14b8a6" opacity="0.04"/>
<circle cx="880" cy="30" r="2" fill="#14b8a6" opacity="0.05"/>
<circle cx="265" cy="95" r="3" fill="#14b8a6" opacity="0.06"/>
<circle cx="450" cy="60" r="1" fill="#14b8a6" opacity="0.07"/>
