    <g transform="translate(78,30) scale(0.85)" opacity="0.12">
      <path d="M30,0 L35,8 L44,5 L44,15 L52,18 L48,27 L55,33 L47,38 L48,47 L39,47 L35,55 L28,49 L20,55 L18,47 L8,47 L10,38 L2,33 L8,27 L5,18 L13,15 L12,5 L22,8 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
